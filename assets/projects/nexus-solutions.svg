<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad6" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0c10"/>
      <stop offset="100%" stop-color="#050608"/>
    </linearGradient>
    <linearGradient id="metalGrad6" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="url(#bgGrad6)"/>
  <rect x="0" y="0" width="800" height="50" fill="#07080a" opacity="0.9"/>
  <circle cx="30" cy="25" r="5" fill="#ef4444"/>
  <circle cx="48" cy="25" r="5" fill="#eab308"/>
  <circle cx="66" cy="25" r="5" fill="#22c55e"/>

  <rect x="250" y="14" width="300" height="22" rx="11" fill="#13161d" stroke="#222833"/>
  <text x="400" y="29" fill="#94a3b8" font-size="11" font-family="'Space Grotesk', sans-serif" text-anchor="middle">nexussolutions.com.br</text>

  <!-- Hero Content -->
  <text x="60" y="115" fill="#38bdf8" font-size="12" font-family="'Plus Jakarta Sans', sans-serif" font-weight="bold" letter-spacing="3">ENTERPRISE IT & GESTÃO</text>
  <text x="60" y="160" fill="#ffffff" font-size="30" font-family="'Space Grotesk', sans-serif" font-weight="bold">Infraestrutura em Nuvem &amp; BI Corporativo</text>
  <text x="60" y="195" fill="#94a3b8" font-size="14" font-family="'Plus Jakarta Sans', sans-serif">Conectando dados, automações e segurança para empresas que buscam escalar.</text>

  <!-- Metric dashboard preview -->
  <g transform="translate(60, 230)">
    <!-- Metric 1 -->
    <rect x="0" y="0" width="210" height="110" rx="12" fill="#11141b" stroke="#222733"/>
    <text x="20" y="35" fill="#94a3b8" font-size="12">UPTIME ANUAL</text>
    <text x="20" y="70" fill="#ffffff" font-size="28" font-family="'Space Grotesk', sans-serif" font-weight="bold">99.98%</text>
    <text x="20" y="92" fill="#22c55e" font-size="11">● Alta disponibilidade SLA</text>

    <!-- Metric 2 -->
    <rect x="235" y="0" width="210" height="110" rx="12" fill="#11141b" stroke="#222733"/>
    <text x="255" y="35" fill="#94a3b8" font-size="12">REDUÇÃO DE CUSTO</text>
    <text x="255" y="70" fill="#ffffff" font-size="28" font-family="'Space Grotesk', sans-serif" font-weight="bold">-42%</text>
    <text x="255" y="92" fill="#38bdf8" font-size="11">● Otimização FinOps Cloud</text>

    <!-- Metric 3 -->
    <rect x="470" y="0" width="210" height="110" rx="12" fill="#11141b" stroke="#222733"/>
    <text x="490" y="35" fill="#94a3b8" font-size="12">DADOS PROCESSADOS</text>
    <text x="490" y="70" fill="#ffffff" font-size="28" font-family="'Space Grotesk', sans-serif" font-weight="bold">+15TB/mês</text>
    <text x="490" y="92" fill="#cbd5e1" font-size="11">● Pipelines automatizados</text>
  </g>

  <!-- CTA -->
  <g transform="translate(60, 370)">
    <rect width="680" height="75" rx="12" fill="#10131a" stroke="#1d222d"/>
    <text x="35" y="44" fill="#ffffff" font-size="15" font-family="'Space Grotesk', sans-serif" font-weight="bold">Precisa de uma solução sob medida para sua empresa?</text>
    <rect x="480" y="18" width="170" height="40" rx="8" fill="url(#metalGrad6)"/>
    <text x="565" y="43" fill="#08090b" font-size="12" font-family="'Space Grotesk', sans-serif" font-weight="bold" text-anchor="middle">Agendar Reunião ➔</text>
  </g>
