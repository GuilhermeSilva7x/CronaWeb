    <rect x="0" y="0" width="210" height="310" rx="12" fill="#131720" stroke="#252d3d"/>
    <rect x="15" y="15" width="180" height="170" rx="8" fill="#1c222e"/>
    <!-- Mock garment silhouette -->
    <path d="M 75 70 L 135 70 L 160 100 L 145 115 L 130 105 L 130 160 L 80 160 L 80 105 L 65 115 L 50 100 Z" fill="#2d3748" opacity="0.6"/>
    <text x="15" y="215" fill="#cbd5e1" font-size="14" font-family="'Space Grotesk', sans-serif" font-weight="bold">Jaqueta Minimalist Tech</text>
    <text x="15" y="235" fill="#94a3b8" font-size="11">Edição Limitada Waterproof</text>
    <text x="15" y="265" fill="#ffffff" font-size="17" font-family="'Space Grotesk', sans-serif" font-weight="bold">R$ 489,90</text>
    <rect x="15" y="278" width="180" height="28" rx="6" fill="url(#silverAcc)"/>
    <text x="105" y="296" fill="#0b0d11" font-size="11" font-weight="bold" text-anchor="middle">Comprar em 1 Clique</text>

    <!-- Product 2 -->
    <rect x="235" y="0" width="210" height="310" rx="12" fill="#131720" stroke="#38bdf8" stroke-width="1.5"/>
    <rect x="250" y="15" width="180" height="170" rx="8" fill="#1c222e"/>
    <rect x="260" y="25" width="55" height="20" rx="4" fill="#38bdf8"/>
    <text x="287" y="38" fill="#0b0d11" font-size="9" font-weight="bold" text-anchor="middle">MAIS VENDIDO</text>
    <!-- Mock watch silhouette -->
    <circle cx="340" cy="100" r="38" fill="#2b3446"/>
    <circle cx="340" cy="100" r="30" fill="#131720" stroke="#cbd5e1" stroke-width="2"/>
    <text x="250" y="215" fill="#ffffff" font-size="14" font-family="'Space Grotesk', sans-serif" font-weight="bold">Chronograph Silver Black</text>
    <text x="250" y="235" fill="#94a3b8" font-size="11">Vidro Safira + Pulseira Aço</text>
    <text x="250" y="265" fill="#ffffff" font-size="17" font-family="'Space Grotesk', sans-serif" font-weight="bold">R$ 890,00</text>
    <rect x="250" y="278" width="180" height="28" rx="6" fill="#38bdf8"/>
    <text x="340" y="296" fill="#0b0d11" font-size="11" font-weight="bold" text-anchor="middle">Comprar em 1 Clique</text>

    <!-- Product 3 -->
    <rect x="470" y="0" width="210" height="310" rx="12" fill="#131720" stroke="#252d3d"/>
    <rect x="485" y="15" width="180" height="170" rx="8" fill="#1c222e"/>
    <!-- Mock sneakers silhouette -->
    <path d="M 520 120 C 530 90, 580 80, 600 100 C 620 120, 640 130, 640 145 L 510 145 Z" fill="#2d3748" opacity="0.6"/>
    <text x="485" y="215" fill="#cbd5e1" font-size="14" font-family="'Space Grotesk', sans-serif" font-weight="bold">Sneaker Stealth Run</text>
    <text x="485" y="235" fill="#94a3b8" font-size="11">Amortecimento Ultra Boost</text>
    <text x="485" y="265" fill="#ffffff" font-size="17" font-family="'Space Grotesk', sans-serif" font-weight="bold">R$ 549,90</text>
    <rect x="485" y="278" width="180" height="28" rx="6" fill="url(#silverAcc)"/>
    <text x="575" y="296" fill="#0b0d11" font-size="11" font-weight="bold" text-anchor="middle">Comprar em 1 Clique</text>
