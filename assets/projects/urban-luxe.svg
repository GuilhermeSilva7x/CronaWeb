<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e1117"/>
      <stop offset="100%" stop-color="#07080a"/>
    </linearGradient>
    <linearGradient id="silverAcc" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="url(#bgGrad3)"/>
  <rect x="0" y="0" width="800" height="50" fill="#080a0e" opacity="0.9"/>
  <circle cx="30" cy="25" r="5" fill="#ef4444"/>
  <circle cx="48" cy="25" r="5" fill="#eab308"/>
  <circle cx="66" cy="25" r="5" fill="#22c55e"/>

  <rect x="250" y="14" width="300" height="22" rx="11" fill="#161b24" stroke="#252c3b"/>
  <text x="400" y="29" fill="#94a3b8" font-size="11" font-family="'Space Grotesk', sans-serif" text-anchor="middle">urbanluxestore.com.br</text>

