  <text x="230" y="94" fill="#94a3b8" font-size="12">NOVIDADES</text>
  <text x="325" y="94" fill="#94a3b8" font-size="12">MASCULINO</text>
  <text x="420" y="94" fill="#94a3b8" font-size="12">FEMININO</text>
  <text x="515" y="94" fill="#94a3b8" font-size="12">ACESSÓRIOS</text>
  <rect x="670" y="78" width="70" height="26" rx="6" fill="#1c222e" stroke="#333e52"/>
  <text x="705" y="95" fill="#38bdf8" font-size="11" font-weight="bold" text-anchor="middle">BAG (3)</text>

  <!-- Products Row -->
  <g transform="translate(60, 130)">
