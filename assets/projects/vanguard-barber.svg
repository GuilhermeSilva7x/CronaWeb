<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0c10"/>
      <stop offset="100%" stop-color="#050607"/>
    </linearGradient>
    <linearGradient id="goldSilverGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="url(#bgGrad2)"/>
  <rect x="0" y="0" width="800" height="50" fill="#07080a" opacity="0.9"/>
  <circle cx="30" cy="25" r="5" fill="#ef4444"/>
  <circle cx="48" cy="25" r="5" fill="#eab308"/>
  <circle cx="66" cy="25" r="5" fill="#22c55e"/>

  <rect x="250" y="14" width="300" height="22" rx="11" fill="#14171e" stroke="#252b36"/>
  <text x="400" y="29" fill="#94a3b8" font-size="11" font-family="'Space Grotesk', sans-serif" text-anchor="middle">vanguardbarberclub.com.br</text>

  <text x="60" y="110" fill="#cbd5e1" font-size="12" font-family="'Plus Jakarta Sans', sans-serif" font-weight="bold" letter-spacing="2">EXPERIÊNCIA & TRADIÇÃO MASCULINA</text>
  <text x="60" y="150" fill="#ffffff" font-size="28" font-family="'Space Grotesk', sans-serif" font-weight="bold">Vanguard Barber Club</text>
  <text x="60" y="178" fill="#94a3b8" font-size="14" font-family="'Plus Jakarta Sans', sans-serif">Selecione seu barbeiro, escolha seu combo e agende seu horário em 30 segundos.</text>

  <!-- Barber selection profiles -->
  <g transform="translate(60, 205)">
    <!-- Barber 1 -->
    <rect x="0" y="0" width="210" height="110" rx="14" fill="#12161f" stroke="#2b323f"/>
    <circle cx="40" cy="45" r="22" fill="#252b37" stroke="#475569"/>
    <text x="40" y="50" fill="#fff" font-size="16" font-family="'Space Grotesk', sans-serif" font-weight="bold" text-anchor="middle">MT</text>
    <text x="75" y="40" fill="#fff" font-size="15" font-family="'Space Grotesk', sans-serif" font-weight="bold">Matheus T.</text>
    <text x="75" y="58" fill="#94a3b8" font-size="12">Master Barber</text>
    <rect x="18" y="78" width="174" height="22" rx="6" fill="#1e2430"/>
    <text x="105" y="93" fill="#38bdf8" font-size="11" font-weight="bold" text-anchor="middle">★ 4.9 (184 avaliações)</text>

    <!-- Barber 2 Selected -->
    <rect x="235" y="0" width="210" height="110" rx="14" fill="#19202c" stroke="#cbd5e1" stroke-width="2"/>
    <circle cx="275" cy="45" r="22" fill="#334155" stroke="#cbd5e1"/>
    <text x="275" y="50" fill="#fff" font-size="16" font-family="'Space Grotesk', sans-serif" font-weight="bold" text-anchor="middle">LR</text>
    <text x="310" y="40" fill="#fff" font-size="15" font-family="'Space Grotesk', sans-serif" font-weight="bold">Lucas Rocha</text>
    <text x="310" y="58" fill="#cbd5e1" font-size="12">Visagista & Fade</text>
    <rect x="253" y="78" width="174" height="22" rx="6" fill="#cbd5e1"/>
    <text x="340" y="93" fill="#0b0d11" font-size="11" font-weight="bold" text-anchor="middle">✓ SELECIONADO</text>

    <!-- Service selection pill -->
    <rect x="470" y="0" width="210" height="110" rx="14" fill="#12161f" stroke="#2b323f"/>
    <text x="490" y="35" fill="#94a3b8" font-size="11" font-weight="bold">SERVIÇO ESCOLHIDO:</text>
    <text x="490" y="60" fill="#fff" font-size="16" font-family="'Space Grotesk', sans-serif" font-weight="bold">Corte + Barba Terapia</text>
    <text x="490" y="85" fill="#22c55e" font-size="15" font-weight="bold">R$ 85,00 (45 min)</text>
  </g>

  <!-- Bottom CTA bar -->
  <g transform="translate(60, 340)">
    <rect width="680" height="115" rx="14" fill="#10141c" stroke="#1d232e"/>
    <text x="30" y="40" fill="#ffffff" font-size="16" font-family="'Space Grotesk', sans-serif" font-weight="bold">Horários Livres Hoje:</text>
    
    <rect x="30" y="58" width="80" height="38" rx="8" fill="#1b212c"/>
    <text x="70" y="82" fill="#fff" font-size="13" font-weight="bold" text-anchor="middle">14:30</text>

    <rect x="120" y="58" width="80" height="38" rx="8" fill="#1b212c"/>
    <text x="160" y="82" fill="#fff" font-size="13" font-weight="bold" text-anchor="middle">15:15</text>

    <rect x="210" y="58" width="80" height="38" rx="8" fill="#1b212c"/>
    <text x="250" y="82" fill="#fff" font-size="13" font-weight="bold" text-anchor="middle">16:45</text>

    <rect x="440" y="58" width="210" height="38" rx="8" fill="url(#goldSilverGrad)"/>
    <text x="545" y="82" fill="#0b0d11" font-size="13" font-family="'Space Grotesk', sans-serif" font-weight="bold" text-anchor="middle">Concluir Agendamento ➔</text>
  </g>
</svg>

